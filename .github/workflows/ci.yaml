name: MarketMind CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATOR_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    defaults:
      run:
        working-directory: backend/services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/services/go.mod
          cache-dependency-path: backend/services/go.sum

      - name: Check Go modules
        run: go mod tidy -diff

      - name: Run Go tests
        run: go test -race -count=1 ./...
