name: MarketMind CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATOR_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    defaults:
      run:
        working-directory: backend/services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/services/go.mod
          cache-dependency-path: backend/services/go.sum

      - name: Check Go modules
        run: go mod tidy -diff

      - name: Run Go tests
        run: go test -race -count=1 ./...

  integration:
    name: Backend integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/tests/go.mod
          cache-dependency-path: backend/tests/go.sum

      - name: Start integration services
        run: docker compose --env-file deploy/integration.env -f deploy/compose.integration.yaml up --build --wait --wait-timeout 180

      - name: Run backend integration tests
        working-directory: backend/tests
        run: |
          set -a
          source ../deploy/integration.env
          set +a
          go test -race -tags=integration -count=1 -v ./...

      - name: Print integration service logs
        if: failure()
        run: docker compose --env-file deploy/integration.env -f deploy/compose.integration.yaml logs --tail=100

      - name: Stop integration services
        if: always()
        run: docker compose --env-file deploy/integration.env -f deploy/compose.integration.yaml down --volumes
