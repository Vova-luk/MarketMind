name: MarketMind CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATOR_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable

    defaults:
      run:
        working-directory: backend/services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/services/go.mod
          cache-dependency-path: backend/services/go.sum

      - name: Check Go modules
        run: go mod tidy -diff

      - name: Run Go tests
        run: go test -race -count=1 ./...
      
      - name: Prepare Compose environment
        working-directory: backend
        run: cp .env.example .env

      - name: Start backend services
        working-directory: backend
        env:
          MARKETMIND_DEPLOY__POSTGRES_PORT: "5433"
          BOT_TOKEN: "123456:ci-placeholder"
          MARKETMIND_TELEGRAM__BOT_TOKEN: "123456:ci-placeholder"
        run: docker compose --env-file .env -f deploy/compose.yaml --profile notifications up --build -d --wait --wait-timeout 180

      - name: Check API health
        working-directory: backend
        run: curl --fail --show-error http://127.0.0.1:8080/health

      - name: Print service logs
        if: failure()
        working-directory: backend
        run: docker compose --env-file .env -f deploy/compose.yaml --profile notifications logs --tail=100

      - name: Stop backend services
        if: always()
        working-directory: backend
        run: docker compose --env-file .env -f deploy/compose.yaml --profile notifications down --volumes --remove-orphans