name: MarketMind CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend/services

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/services/go.mod
          cache-dependency-path: backend/services/go.sum

      - name: Check Go modules
        run: go mod tidy -diff

      - name: Run Go tests
        run: go test -race -count=1 ./...
