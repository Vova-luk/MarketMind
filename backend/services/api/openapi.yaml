openapi: 3.1.0
info:
  title: MarketMind Mini App API
  version: 1.0.0-draft
  description: |
    Каждый запрос Mini App содержит Authorization: tma <Telegram.WebApp.initData>.
    При каждом открытии клиент сначала вызывает POST /users/me.
    Остальные операции требуют регистрации (иначе 404 USER_NOT_REGISTERED).
    Пользователь определяется только по проверенному initData.
    Ответы Mini App персональные: Cache-Control: no-store.
    Служебный метод gRPC marketmind.api.v1.MarketCatalogService/GetMarketsToCheck
    возвращает рынки всех пользователей.
    Контракт метода находится в ../proto/api/api.proto.

    Единица отслеживания — spot-рынок (биржа + base_asset + quote_asset).
    Поддерживаются валюты котировки доступных биржевых пар, не только USDT.
    Цена означает количество quote_asset за одну единицу base_asset; конвертации нет.
    BIGINT и десятичные значения — строки. Для подписки UI собирает подпись из base_asset и quote_asset.
    Код quote_asset передаётся отдельно: символ валюты и формат числа выбирает UI.
    Базовая монета, валюта котировки и внешний ID сохранённого рынка неизменны;
    для другой пары создаётся отдельная подписка.
    UI передаёт выбранный результат поиска для добавления. Отслеживаемое возвращает subscription_id
    для открытия карточки, удаления подписки и управления алертами.

    Неизвестные поля JSON/query, повторяющиеся
    query-параметры и неверные значения отклоняются с 400 VALIDATION_ERROR.
    Для JSON-тела нужен Content-Type: application/json (иначе 415).
    POST /users/me не читает тело запроса.

    Пустая коллекция — items: []. Список и карточка читают последнюю сохранённую
    цену из markets.price. Для отключённой биржи price равен null.
    Карточка также возвращает updated_at — время последней записи цены.
    Лимиты подписок и активных алертов задаются конфигурацией сервиса.
    Лимит подписок на пользователя задаётся через subscriptions.limit (по умолчанию 50).
    Лимит активных алертов применяется ко всем подпискам пользователя (alerts.active_limit, по умолчанию 50).
servers:
- {url: /api/v1}
tags:
- name: Users
  description: Инициализация пользователя Mini App.
- name: Markets
  description: Каталог рынков и бирж.
- name: Subscriptions
  description: Персональный список отслеживания и карточка рынка.
- name: Alerts
  description: Условия уведомлений для отслеживаемого рынка.
- name: Internal
  description: Служебные запросы Exchange-Data к API.
security:
- TelegramInitData: []
paths:
  /users/me:
    post:
      tags:
      - Users
      x-implementation-status: implemented
      operationId: registerCurrentUser
      summary: Зарегистрировать пользователя при открытии Mini App
      description: |
        Идемпотентная инициализация без тела запроса. Первый и повторные вызовы
        возвращают 200 и один и тот же Telegram ID. Существующие подписки, алерты
        и настройки уведомлений сохраняются. Флаг is_new клиенту для этого сценария не нужен.
      responses:
        '200':
          description: Пользователь зарегистрирован или уже существует.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
              example: {telegram_user_id: '123456789'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /exchanges:
    get:
      tags:
      - Markets
      x-implementation-status: implemented
      operationId: listExchanges
      summary: Получить активные биржи для фильтра
      responses:
        '200':
          description: Активные биржи в порядке названия. Если их нет, items будет пустым массивом.
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Exchange'}
              example:
                items:
                - {id: 1, name: Binance}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /markets:
    get:
      tags:
      - Markets
      x-implementation-status: implemented
      operationId: searchMarkets
      summary: Найти рынки для выпадающего списка
      description: |
        API передаёт имя выбранной биржи, q, page и limit в Exchange-Data по gRPC.
        Поиск по подстроке охватывает внешний ID и подпись пары BASE/QUOTE без учёта регистра.
        Exchange-Data возвращает активные спотовые пары, включая пары без записей в нашей БД.
        Один инструмент включается в результат один раз.
        Пустой q или его отсутствие возвращают страницу каталога.
        Перед пагинацией результаты сортируются лексикографически по external_id ASC.
        GET ничего не создаёт в БД.
        Ответ содержит exchange_id, external_id, base_asset, quote_asset, display_name и price.
        Источник передаёт коды активов отдельно.
        API формирует display_name как base_asset + "/" + quote_asset; полное имя монеты не требуется.
        UI передаёт выбранный объект целиком в POST /subscriptions.
        Если цена недоступна, price равен null. Для первого сохранения рынка требуется положительная цена.
        Уже добавленные инструменты также присутствуют: повторное добавление безопасно.
        Неизвестная/отключённая exchange_id — 404 EXCHANGE_NOT_FOUND.
        Недоступность каталога — 503 MARKET_CATALOG_UNAVAILABLE, а не пустой список.
        При изменении каталога между страницами снимок результатов не фиксируется.
      parameters:
      - name: q
        in: query
        description: Подстрока внешнего ID или подписи пары. Пробелы по краям удаляются.
        schema: {type: string, maxLength: 120}
        example: BTC
      - name: exchange_id
        in: query
        required: true
        description: Биржа, выбранная пользователем из GET /exchanges. Сначала выбирается биржа, затем монета.
        schema: {$ref: '#/components/schemas/ExchangeId'}
        example: 1
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Страница результатов. При отсутствии совпадений items будет пустым массивом.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketPage'}
              example:
                items:
                - exchange_id: 1
                  external_id: BTCEUR
                  base_asset: BTC
                  quote_asset: EUR
                  display_name: BTC/EUR
                  price: '77000'
                - exchange_id: 1
                  external_id: BTCUSDT
                  base_asset: BTC
                  quote_asset: USDT
                  display_name: BTC/USDT
                  price: '83781.50'
                next_page: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /subscriptions:
    get:
      tags:
      - Subscriptions
      x-implementation-status: implemented
      operationId: listSubscriptions
      summary: Получить список отслеживаемых рынков
      description: |
        Подписки текущего пользователя по subscription_id ASC, включая рынки
        отключённых бирж (для них price: null).
        Каждая строка содержит subscription_id, base_asset, quote_asset, exchange_name и price.
      parameters:
      - {$ref: '#/components/parameters/ListPage'}
      - {$ref: '#/components/parameters/ListPageSize'}
      responses:
        '200':
          description: Список подписок в порядке добавления. Если подписок нет, items будет пустым массивом.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionList'}
              example:
                items:
                - subscription_id: '18'
                  exchange_name: Binance
                  price: '83781'
                  base_asset: BTC
                  quote_asset: USDT
                next_page: null
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags:
      - Subscriptions
      x-implementation-status: implemented
      operationId: addSubscription
      summary: Добавить рынок в отслеживаемое
      description: |
        Находит рынок по (exchange_id, external_id) и создаёт только подписку текущего
        пользователя, если рынок уже есть. Если подписка тоже есть — 200 с прежним ID,
        даже при отключённой бирже, исчерпанном лимите или недоступном каталоге/котировке.
        Новая подписка требует активной биржи и места в лимите.

        Для нового рынка UI передаёт base_asset, quote_asset и price из результата поиска.
        API проверяет формат полей и использует цену как начальную. Поле display_name
        можно передать вместе с объектом поиска, при сохранении оно игнорируется.
        Имя биржи берётся из БД. POST сохраняет данные без обращения к Exchange-Data.
        Если для нового рынка отсутствуют коды активов или положительная цена,
        сервер возвращает 400 VALIDATION_ERROR.
        Неизвестная биржа — 404 EXCHANGE_NOT_FOUND.
        Запись рынка и подписки выполняется атомарно. При параллельном добавлении
        используется сохранённый рынок. Если та же пара сохранена под другим внешним
        ID на этой бирже, возвращается 409 MARKET_CONFLICT.
        Для существующего рынка API использует цену из БД, а для отключённой биржи
        возвращает price: null. Размер JSON-тела — до 8 КиБ.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubscriptionCreate'}
            examples:
              existing:
                summary: Рынок уже сохранён
                value: {exchange_id: 1, external_id: BTCUSDT}
              selected:
                summary: Выбранный результат поиска для первого добавления
                value:
                  exchange_id: 1
                  external_id: BTCUSDT
                  base_asset: BTC
                  quote_asset: USDT
                  display_name: BTC/USDT
                  price: '83781.50'
      responses:
        '200':
          description: Подписка уже существует.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
              example:
                subscription_id: '18'
                exchange_name: Binance
                price: '83781'
                base_asset: BTC
                quote_asset: USDT
        '201':
          description: Создана новая подписка на новый или существующий рынок.
          headers:
            Location:
              description: Путь к созданной подписке.
              schema:
                type: string
                examples:
                - /api/v1/subscriptions/18
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Subscription'}
              example:
                subscription_id: '18'
                exchange_name: Binance
                price: '83781'
                base_asset: BTC
                quote_asset: USDT
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /subscriptions/{subscription_id}:
    parameters:
    - {$ref: '#/components/parameters/SubscriptionId'}
    get:
      tags:
      - Subscriptions
      x-implementation-status: implemented
      operationId: getSubscription
      summary: Получить карточку отслеживаемого рынка и список его алертов
      responses:
        '200':
          description: Карточка с сохранённой ценой, временем её обновления и всеми алертами по alert_id ASC.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubscriptionDetail'}
              example:
                subscription_id: '18'
                exchange_name: Binance
                price: '83781'
                updated_at: '2026-11-09T08:30:00Z'
                alerts:
                - alert_id: '9'
                  type: percent
                  value: '5'
                  direction: gte
                  reference_price: '83781'
                  target_price: '87970.05'
                  is_active: true
                - alert_id: '10'
                  type: percent
                  value: '-5'
                  direction: lte
                  reference_price: '83781'
                  target_price: '79591.95'
                  is_active: false
                - alert_id: '11'
                  type: price
                  value: '83000'
                  direction: lte
                  reference_price: '83781'
                  target_price: '83000'
                  is_active: true
                base_asset: BTC
                quote_asset: USDT
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags:
      - Subscriptions
      x-implementation-status: implemented
      operationId: deleteSubscription
      summary: Удалить рынок из отслеживаемого вместе с его алертами
      description: |
        Атомарное каскадное удаление, включая отключённые алерты; работает и для отключённой биржи.
        Повторное удаление возвращает 404 SUBSCRIPTION_NOT_FOUND.
        Уже переданное в доставку уведомление может прийти после удаления.
      responses:
        '204':
          description: Подписка и её алерты удалены.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /subscriptions/{subscription_id}/alerts:
    parameters:
    - {$ref: '#/components/parameters/SubscriptionId'}
    get:
      tags:
      - Alerts
      x-implementation-status: implemented
      operationId: listSubscriptionAlerts
      summary: Получить список алертов подписки
      description: |
        Все активные и отключённые алерты по alert_id ASC. В самостоятельном ответе
        каждый алерт содержит quote_asset. Нужен для обновления алертов без повторной загрузки карточки.
        Цель рассчитывается при чтении из сохранённого условия и reference_price.
        Текущая цена и доступность биржи не влияют на сохранённые условия.
      parameters:
      - {$ref: '#/components/parameters/ListPage'}
      - {$ref: '#/components/parameters/ListPageSize'}
      responses:
        '200':
          description: Список алертов; items пуст, если условия ещё не созданы.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertList'}
              examples:
                configured:
                  summary: Рост, падение и конкретная цена; исходная цена при создании — 83781 USDT
                  value:
                    items:
                    - alert_id: '9'
                      type: percent
                      value: '5'
                      direction: gte
                      reference_price: '83781'
                      target_price: '87970.05'
                      is_active: true
                      quote_asset: USDT
                    - alert_id: '10'
                      type: percent
                      value: '-5'
                      direction: lte
                      reference_price: '83781'
                      target_price: '79591.95'
                      is_active: false
                      quote_asset: USDT
                    - alert_id: '11'
                      type: price
                      value: '83000'
                      direction: lte
                      reference_price: '83781'
                      target_price: '83000'
                      is_active: true
                      quote_asset: USDT
                    next_page: null
                empty:
                  summary: Алерты ещё не созданы
                  value:
                    items: []
                    next_page: null
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags:
      - Alerts
      x-implementation-status: implemented
      operationId: createAlert
      summary: Добавить активный алерт на рынок
      description: |
        Клиент передаёт type, value и direction. Сервер читает последнюю сохранённую цену из
        markets.price и фиксирует её в alerts.reference_price. Размер JSON-тела — до 8 КиБ.
        Для price value — положительная целевая цена в quote_asset подписки: target_price = value.
        reference_price и target_price также измеряются в quote_asset. Код валюты берётся из рынка,
        клиент не может задать или поменять его в запросе алерта.
        Цель, равная reference_price, отклоняется с 400.
        Для percent знак value задаёт положение цели относительно базы: "5" означает на 5% выше, "-5" — на 5% ниже.
        target_price = reference_price * (1 + value / 100).
        Нулевой процент и падение на 100% или больше запрещены.
        Целевая цена должна быть в (0; 500000] единиц quote_asset (текущий лимит, без пересчёта в USD). Вычисления десятичные, без float64.
        Сервер сохраняет переданный direction. Он задаёт направление пересечения независимо от цели.
        Требуются активная биржа, положительная сохранённая цена и место в лимите активных алертов.
        Создание само по себе не отправляет уведомление: отслеживаются последующие пересечения.
        POST не идемпотентен: повтор создаёт ещё один алерт. После тайм-аута клиент
        перечитывает список и не повторяет POST автоматически.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertCreate'}
            examples:
              price:
                summary: Достичь 83000 USDT; при исходной цене 83781 это падение
                value: {type: price, value: '83000', direction: lte}
              percentUp:
                summary: Рост на 5% от цены при создании
                value: {type: percent, value: '5', direction: gte}
              percentDown:
                summary: Падение на 5% от цены при создании
                value: {type: percent, value: '-5', direction: lte}
      responses:
        '201':
          description: Создан новый активный алерт.
          headers:
            Location:
              description: Путь к созданному алерту; поддерживает PATCH и DELETE.
              schema:
                type: string
                examples:
                - /api/v1/subscriptions/18/alerts/9
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
              example:
                alert_id: '9'
                type: percent
                value: '5'
                direction: gte
                reference_price: '83781'
                target_price: '87970.05'
                is_active: true
                quote_asset: USDT
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /subscriptions/{subscription_id}/alerts/{alert_id}:
    parameters:
    - {$ref: '#/components/parameters/SubscriptionId'}
    - name: alert_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    patch:
      tags:
      - Alerts
      x-implementation-status: implemented
      operationId: updateAlert
      summary: Изменить условие или включить и выключить алерт
      description: |
        Передаётся is_active и/или полный набор type, value, direction. Пустое тело, null
        и неполный набор условия — 400 VALIDATION_ERROR. Размер JSON-тела — до 8 КиБ.
        При фактическом изменении type/value сервер фиксирует новую reference_price из markets.price.
        Если меняется только направление direction, база и цель сохраняются.
        Значения "5" и "5.0" считаются одинаковыми.
        Изменение только is_active сохраняет исходную цену, цель и направление.
        Для изменения условия и включения нужны активная биржа и положительная сохранённая цена;
        при переходе false → true также проверяется лимит активных алертов.
        Отключение работает без котировки и для отключённой биржи.
        Повтор неизменного запроса возвращает 200 без сброса состояния отслеживания.
        Изменение условия или включение задаёт новую начальную точку отслеживания,
        но само по себе не отправляет уведомление.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertPatch'}
            examples:
              disable:
                value: {is_active: false}
              change:
                value: {type: percent, value: '-5', direction: lte}
      responses:
        '200':
          description: Алерт после изменения.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
              example:
                alert_id: '9'
                type: percent
                value: '5'
                direction: gte
                reference_price: '83781'
                target_price: '87970.05'
                is_active: false
                quote_asset: USDT
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags:
      - Alerts
      x-implementation-status: implemented
      operationId: deleteAlert
      summary: Удалить алерт
      description: |
        Доступно без котировки и на отключённой бирже. Повторное удаление — 404 ALERT_NOT_FOUND.
        Уже переданное в доставку уведомление может прийти после удаления.
      responses:
        '204':
          description: Алерт удалён.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /internal/v1/tracked-markets:
    servers:
    - {url: /}
    get:
      tags: [Internal]
      x-implementation-status: planned
      operationId: listTrackedMarkets
      summary: Получить рынки всех пользователей для опроса бирж
      security:
      - ServiceToken: []
      description: |
        Планируемый HTTP-вариант служебного метода gRPC MarketCatalogService/GetMarketsToCheck.
        API читает БД и возвращает полный текущий список рынков активных бирж,
        на которые есть хотя бы одна подписка. Пользователь и наличие активных алертов
        не ограничивают выборку. Рынок включается один раз независимо от числа подписок.
        Используется EXISTS по subscriptions.market_id, без размножения строк JOIN-ом.
        Биржи без отслеживаемых рынков не включаются. Сортировка по имени биржи и числовому ID рынка.
        Для MVP ответ без пагинации; это единая выборка на момент чтения, Cache-Control: no-store.
        Пустой результат — 200 с items: []; ошибка БД — 503, а не пустая коллекция.

        Exchange-Data обращается к биржам с external_id в их исходном формате,
        затем публикует изменённые цены в Kafka (Price-Checked-Topic).
        Tracking читает эти события и проверяет алерты соответствующего рынка.
        market_id служит идентификатором рынка для связи события с подписками;
        BTC/USDT и BTC/EUR имеют разные market_id, даже на одной бирже.
        Схема Kafka-события описывается отдельно от этого HTTP-контракта.
        Эта ручка только читает список: цены через неё не принимаются и не обновляются.
        Telegram-регистрация не требуется; сервисный токен проверяется отдельно.
      responses:
        '200':
          description: Полный список отслеживаемых рынков, сгруппированный по бирже.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TrackedMarketList'}
              example:
                items:
                - exchange_name: Binance
                  markets:
                  - {market_id: '42', external_id: BTCUSDT}
                  - {market_id: '43', external_id: BTCEUR}
                - exchange_name: OKX
                  markets:
                  - {market_id: '44', external_id: BTC-USDT}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401':
          description: SERVICE_AUTH_INVALID — сервисный токен отсутствует или неверен.
          headers:
            WWW-Authenticate:
              schema: {type: string, const: Bearer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error: {code: SERVICE_AUTH_INVALID, message: Missing or invalid service token}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          description: SERVICE_UNAVAILABLE — БД или настройка сервисной авторизации недоступна.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example:
                error: {code: SERVICE_UNAVAILABLE, message: Service temporarily unavailable}
components:
  securitySchemes:
    ServiceToken:
      type: http
      scheme: bearer
      description: Сервисный секрет Exchange-Data для Authorization Bearer; проверяется API, не является Telegram initData.
    TelegramInitData:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Полное значение заголовка tma <Telegram.WebApp.initData> (исходная строка, не initDataUnsafe).
        Сервер проверяет подпись и user.id. Текущая политика middleware: auth_date не старше
        24 часов, допустимое время в будущем — не больше 1 минуты. Это настройки проекта.
  parameters:
    SubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Id'}
    ListPage:
      name: page
      in: query
      description: Номер страницы, начиная с 1.
      schema: {type: integer, format: int32, minimum: 1, maximum: 2147483647, default: 1}
    ListPageSize:
      name: page_size
      in: query
      description: Количество элементов на странице.
      schema: {type: integer, minimum: 1, maximum: 100, default: 10}
  responses:
    BadRequest:
      description: VALIDATION_ERROR — неверный ID (включая переполнение BIGINT), query-параметр, JSON-тело или значение/вычисленный
        порог алерта.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error: {code: VALIDATION_ERROR, message: Invalid alert value}
    Unauthorized:
      description: Заголовок отсутствует либо данные Telegram неверны или просрочены.
      headers:
        WWW-Authenticate:
          schema: {type: string, const: tma}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example:
            error: {code: TELEGRAM_AUTH_INVALID, message: Missing or invalid Telegram initData}
    NotFound:
      description: |
        USER_NOT_REGISTERED, EXCHANGE_NOT_FOUND, MARKET_NOT_FOUND, SUBSCRIPTION_NOT_FOUND
        или ALERT_NOT_FOUND. Для чужой подписки/алерта и алерта другой подписки также 404,
        без раскрытия существования ресурса. При отсутствующей/чужой родительской подписке
        используется SUBSCRIPTION_NOT_FOUND. Пустой список и страница за пределами списка — 200.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: EXCHANGE_INACTIVE, SUBSCRIPTION_LIMIT_REACHED, ACTIVE_ALERT_LIMIT_REACHED или MARKET_CONFLICT. Лимиты проверяются
        атомарно при создании/включении; чтение, удаление и отключение доступны.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE — ожидается Content-Type application/json (допускается charset=utf-8).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: INTERNAL_ERROR — внутренняя ошибка сервиса.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: |
        TELEGRAM_AUTH_UNAVAILABLE — не настроена авторизация; SERVICE_UNAVAILABLE —
        недоступно обязательное хранилище; MARKET_CATALOG_UNAVAILABLE — недоступен каталог
        инструментов для поиска или создания нового рынка; QUOTE_UNAVAILABLE — не удалось
        получить текущую цену для создания рынка или создания/изменения/включения алерта.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    TrackedMarketList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [exchange_name, markets]
            properties:
              exchange_name: {type: string, examples: [Binance]}
              markets:
                type: array
                minItems: 1
                items:
                  type: object
                  required: [market_id, external_id]
                  properties:
                    market_id: {$ref: '#/components/schemas/Id'}
                    external_id: {$ref: '#/components/schemas/ExternalInstrumentId'}
    Id:
      type: string
      pattern: ^[1-9][0-9]{0,18}$
      description: Положительное целое от 1 до 9223372036854775807, передаваемое строкой без ведущих нулей. Верхнюю
        границу сервер проверяет численно, сверх regex.
      examples:
      - '42'
    ExchangeId:
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
    User:
      type: object
      required:
      - telegram_user_id
      properties:
        telegram_user_id: {$ref: '#/components/schemas/Id'}
    Exchange:
      type: object
      required:
      - id
      - name
      properties:
        id: {$ref: '#/components/schemas/ExchangeId'}
        name:
          type: string
          examples:
          - Binance
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              examples:
              - VALIDATION_ERROR
            message: {type: string}
    Decimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$(?![\s\S])
      description: Десятичная строка с точкой, без экспоненты, пробелов и ведущего плюса.
      examples:
      - '-5'
      - '83781.50'
    PositiveDecimal:
      allOf:
      - {$ref: '#/components/schemas/Decimal'}
      - not: {pattern: '^(-|0(\.0+)?$)'}
    PriceValue:
      allOf:
      - {$ref: '#/components/schemas/PositiveDecimal'}
      - {pattern: '^((0|[1-9][0-9]{0,4}|[1-4][0-9]{5})(\.[0-9]+)?|500000(\.0+)?)$'}
      description: Значение в диапазоне (0; 500000]. Для цены/цели измеряется в quote_asset рынка; лимит пока одинаков
        численно для всех валют, без конвертации.
    PercentValue:
      allOf:
      - {$ref: '#/components/schemas/Decimal'}
      - not: {pattern: '^-?0(\.0+)?$'}
      anyOf:
      - {$ref: '#/components/schemas/PriceValue'}
      - {pattern: '^-(0|[1-9][0-9]?)(\.[0-9]+)?$'}
      description: 'Знаковый процент: -100 < value <= 500000, value != 0. Рост — "5", падение — "-5". Вычисленная
        целевая цена также должна быть в (0; 500000].'
    MarketOption:
      type: object
      required:
      - exchange_id
      - external_id
      - base_asset
      - quote_asset
      - display_name
      - price
      properties:
        exchange_id: {$ref: '#/components/schemas/ExchangeId'}
        external_id: {$ref: '#/components/schemas/ExternalInstrumentId'}
        base_asset: {$ref: '#/components/schemas/AssetCode'}
        quote_asset: {$ref: '#/components/schemas/AssetCode'}
        display_name:
          type: string
          description: 'Готовая подпись: base_asset + "/" + quote_asset, без пробелов и биржи. Не используется как
            ключ.'
          examples:
          - BTC/USDT
          - BTC/EUR
        price:
          $ref: '#/components/schemas/MarketSearchPrice'
          description: Цена на момент поиска в quote_asset. При недоступности котировки — null.
    ExternalInstrumentId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[^\s]+$(?![\s\S])
      description: |
        Идентификатор инструмента, полученный от биржи через Exchange-Data.
        Сохраняется в markets.external_id при добавлении; внутренние BIGSERIAL ID не заменяет.
        Исходный формат биржи сохраняется: например BTCUSDT либо BTC-USDT. Уникален только вместе с exchange_id
        в поддерживаемом spot-каталоге. UI передаёт строку из поиска без изменения;
        регистр значим, преобразования и разбор символа на клиенте не нужны.
      examples:
      - BTCUSDT
      - BTC-USDT
      - BTCEUR
    SubscriptionCreate:
      type: object
      required:
      - exchange_id
      - external_id
      additionalProperties: false
      properties:
        exchange_id: {$ref: '#/components/schemas/ExchangeId'}
        external_id: {$ref: '#/components/schemas/ExternalInstrumentId'}
        base_asset: {$ref: '#/components/schemas/AssetCode'}
        quote_asset: {$ref: '#/components/schemas/AssetCode'}
        display_name:
          type: string
          description: Подпись из поиска. При сохранении игнорируется.
        price: {$ref: '#/components/schemas/MarketSearchPrice'}
      description: Для первой записи рынка нужны base_asset, quote_asset и положительная price.
    MarketSearchPrice:
      oneOf:
      - $ref: '#/components/schemas/PositiveDecimal'
        maxLength: 256
      - {type: 'null'}
    MarketPage:
      type: object
      required:
      - items
      - next_page
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MarketOption'}
        next_page:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 2147483647
          description: Номер следующей страницы или null. Страница за пределами списка возвращает пустой items и
            null.
    Subscription:
      type: object
      required:
      - subscription_id
      - base_asset
      - quote_asset
      - exchange_name
      - price
      properties:
        subscription_id:
          $ref: '#/components/schemas/Id'
          description: ID подписки, используемый в путях карточки, удаления и алертов.
        base_asset: {$ref: '#/components/schemas/AssetCode'}
        quote_asset: {$ref: '#/components/schemas/AssetCode'}
        exchange_name:
          type: string
          examples:
          - Binance
        price:
          oneOf:
          - {$ref: '#/components/schemas/PositiveDecimal'}
          - {type: 'null'}
          description: Последняя сохранённая цена в quote_asset за единицу base_asset. Для отключённой биржи — null.
    SubscriptionList:
      type: object
      required:
      - items
      - next_page
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Subscription'}
        next_page: {$ref: '#/components/schemas/NextListPage'}
    NextListPage:
      type: [integer, 'null']
      minimum: 1
      maximum: 2147483647
      description: Номер следующей страницы или null. За пределами списка items будет пустым массивом.
    SubscriptionDetail:
      allOf:
      - {$ref: '#/components/schemas/Subscription'}
      - type: object
        required:
        - updated_at
        - alerts
        properties:
          updated_at:
            type: string
            format: date-time
            description: Время записи последней цены рынка в UTC. До первого обновления совпадает со временем создания рынка.
          alerts:
            type: array
            items: {$ref: '#/components/schemas/SubscriptionAlert'}
    AlertType:
      type: string
      enum:
      - price
      - percent
    AlertDirection:
      type: string
      enum: [gte, lte]
      description: Направление пересечения цели. gte означает снизу вверх, lte — сверху вниз.
    AlertValueRules:
      if:
        required:
        - type
        properties:
          type: {const: price}
      then:
        properties:
          value: {$ref: '#/components/schemas/PriceValue'}
      else:
        properties:
          value: {$ref: '#/components/schemas/PercentValue'}
    AlertCreate:
      type: object
      required:
      - type
      - value
      - direction
      properties:
        type: {$ref: '#/components/schemas/AlertType'}
        value: {$ref: '#/components/schemas/Decimal'}
        direction: {$ref: '#/components/schemas/AlertDirection'}
      additionalProperties: false
      allOf:
      - {$ref: '#/components/schemas/AlertValueRules'}
    AlertPatch:
      type: object
      properties:
        type: {$ref: '#/components/schemas/AlertType'}
        value: {$ref: '#/components/schemas/Decimal'}
        direction: {$ref: '#/components/schemas/AlertDirection'}
        is_active: {type: boolean}
      additionalProperties: false
      allOf:
      - {$ref: '#/components/schemas/AlertValueRules'}
      oneOf:
      - required:
        - is_active
        not:
          anyOf:
          - required:
            - type
          - required:
            - value
          - required:
            - direction
      - required:
        - type
        - value
        - direction
      description: Только is_active либо полный набор type, value, direction с необязательным is_active.
    SubscriptionAlert:
      type: object
      required:
      - alert_id
      - type
      - value
      - direction
      - reference_price
      - target_price
      - is_active
      properties:
        alert_id: {$ref: '#/components/schemas/Id'}
        type: {$ref: '#/components/schemas/AlertType'}
        value: {$ref: '#/components/schemas/Decimal'}
        direction: {$ref: '#/components/schemas/AlertDirection'}
        reference_price:
          $ref: '#/components/schemas/PositiveDecimal'
          description: Цена пары в момент создания алерта или изменения его условия.
        target_price:
          $ref: '#/components/schemas/PriceValue'
          description: Целевая цена в валюте котировки подписки, вычисленная сервером.
        is_active: {type: boolean}
      allOf:
      - {$ref: '#/components/schemas/AlertValueRules'}
      description: |
        У price цель равна value. У percent сервер рассчитывает её из сохранённых
        reference_price и value. UI может показать переход от reference_price к target_price.
        Для gte уведомление при previous < target <= current, для lte —
        previous > target >= current. Срабатывание не выключает алерт;
        повтор возможен только после возврата и нового пересечения.
        is_active отражает настройку пользователя, а не доступность биржи или доставку.
    Alert:
      allOf:
      - {$ref: '#/components/schemas/SubscriptionAlert'}
      - type: object
        required: [quote_asset]
        properties:
          quote_asset: {$ref: '#/components/schemas/AssetCode'}
    AlertList:
      type: object
      required:
      - items
      - next_page
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Alert'}
        next_page: {$ref: '#/components/schemas/NextListPage'}
    AssetCode:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[^\s/]+$(?![\s\S])
      description: Код актива из метаданных биржи, например BTC, USDT или EUR. Не значок валюты.
      examples:
      - BTC
      - USDT
      - EUR
