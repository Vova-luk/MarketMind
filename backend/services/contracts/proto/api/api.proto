syntax = "proto3"

package marketmind.api.v1;

option go_package = "marketmind/gen/go/api/;api";

service MarketCatalogService {
  rpc GetMarketsToCheck(GetMarketsToCheckRequest)
      returns (GetMarketsToCheckResponse);
}

message GetMarketsToCheckRequest {}

message GetMarketsToCheckResponse {
  repeated ExchangeMarkets items = 1;
}

message ExchangeMarkets {
  string exchange_name = 1;
  repeated MarketToCheck markets = 2;
}

message MarketToCheck {
  string market_id = 1;
  string external_id = 2;
}